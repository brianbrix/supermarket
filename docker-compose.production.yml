version: '3.8'

services:

  # PostgreSQL for supermarket
  supermarket_db:
    image: postgres:15-alpine
    container_name: supermarket_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-supermarket}
      POSTGRES_USER: ${DB_USERNAME:-supermarket}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supermarket}
    volumes:
      - supermarket_db_data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-supermarket}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traefik_network

  # Redis for supermarket backend
  redis:
    image: redis:7-alpine
    container_name: supermarket_redis
    restart: always
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - traefik_network

  # Supermarket Backend (Laravel)
  supermarket_backend:
    build:
      context: ./backend-php
      dockerfile: ../docker/backend/Dockerfile
    image: supermarket-backend:latest
    container_name: supermarket_backend
    restart: always
    env_file:
      - backend-php/.env.production
    environment:
      APP_KEY: ${APP_KEY:-base64:/jZayb6p3OtqHig6b6nrfNw7oofDksLLtWiOSfDwTWI=}
      APP_URL: https://shop.afyaquik.com
      DB_HOST: supermarket_db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-supermarket}
      DB_USERNAME: ${DB_USERNAME:-supermarket}
      DB_PASSWORD: ${DB_PASSWORD:-supermarket}
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SITENAME: ${SITENAME:-shop}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    volumes:
      - supermarket_backend_storage:/var/www/html/storage
      - supermarket_backend_cache:/var/www/html/bootstrap/cache
    depends_on:
      supermarket_db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - traefik_network

  # Supermarket Frontend (React + Nginx)
  supermarket_frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.production
      args:
        VITE_API_BASE_URL: https://shop.afyaquik.com/api
        VITE_BASE_PATH: /
    image: supermarket-frontend:latest
    container_name: supermarket_frontend
    restart: always
    depends_on:
      - supermarket_backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.supermarket.rule=Host(`shop.afyaquik.com`)"
      - "traefik.http.routers.supermarket.entrypoints=websecure"
      - "traefik.http.routers.supermarket.tls.certresolver=letsencrypt"
      - "traefik.http.routers.supermarket.middlewares=supermarket-headers"
      - "traefik.http.services.supermarket.loadbalancer.server.port=80"
      - "traefik.http.middlewares.supermarket-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.supermarket-headers.headers.customrequestheaders.X-Forwarded-Port=443"
      - "traefik.http.middlewares.supermarket-headers.headers.customrequestheaders.X-Forwarded-Host=shop.afyaquik.com"
      - "traefik.http.middlewares.supermarket-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.supermarket-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.supermarket-headers.headers.stsPreload=true"
      - "traefik.http.middlewares.supermarket-headers.headers.forceSTSHeader=true"
    networks:
      - traefik_network

volumes:
  supermarket_db_data:
  supermarket_backend_storage:
  supermarket_backend_cache:

networks:
  traefik_network:
    external: true
    name: hotspot_default
